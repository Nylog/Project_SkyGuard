[project]
name = "project-skyguard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nylog"}
]
requires-python = ">=3.12, <3.13"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "flask>=3.1.3",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "langchain>=1.3.18",
    "langchain-core>=1.6.1",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "torch>=2.11.0",
    "transformers>=5.16.1",
]

[project.scripts]
project-skyguard = "project_skyguard:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"


[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
